name: PR Actions

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-actions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/NatsManager.Frontend/package-lock.json

      - name: Restore Aspire workload
        run: dotnet workload restore NatsManager.slnx

      - name: Restore .NET dependencies
        run: dotnet restore NatsManager.slnx

      - name: Install frontend dependencies
        working-directory: src/NatsManager.Frontend
        run: npm ci --ignore-scripts

      # Lint and format are listed as contribution gates in the README; they are enforced
      # here so the documented gate and the enforced gate are the same thing.
      - name: Lint frontend
        working-directory: src/NatsManager.Frontend
        run: npm run lint

      # Type-checks src and the test files (tsconfig.test.json), then bundles.
      - name: Build frontend
        working-directory: src/NatsManager.Frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: src/NatsManager.Frontend
        run: npm test

      # Formatting only. The third `dotnet format` pass, `analyzers`, is deliberately not
      # part of this gate: it auto-applies fixes for any analyzer diagnostic at warning
      # level, which currently means rewriting ~159 test call sites for xUnit1051. That
      # rule is intentionally visible rather than silenced (see tests/Directory.Build.props),
      # and migrating those call sites is its own change — not something a formatting gate
      # should block on.
      - name: Verify .NET formatting
        run: |
          dotnet format whitespace NatsManager.slnx --verify-no-changes
          dotnet format style NatsManager.slnx --verify-no-changes

      - name: Build .NET solution
        run: dotnet build NatsManager.slnx --configuration Release --no-restore

      - name: Run .NET unit tests
        run: |
          dotnet test --project tests/NatsManager.Domain.Tests/NatsManager.Domain.Tests.csproj --configuration Release --no-restore --verbosity minimal
          dotnet test --project tests/NatsManager.Application.Tests/NatsManager.Application.Tests.csproj --configuration Release --no-restore --verbosity minimal
          dotnet test --project tests/NatsManager.Infrastructure.Tests/NatsManager.Infrastructure.Tests.csproj --configuration Release --no-restore --verbosity minimal
          dotnet test --project tests/NatsManager.Web.Tests/NatsManager.Web.Tests.csproj --configuration Release --no-restore --verbosity minimal

      # NatsManager.Integration.Tests starts the Aspire AppHost and a real NATS container.
      # It fails loudly rather than skipping when the container cannot start, so a green
      # run here means the adapters were genuinely exercised against a NATS server.
      - name: Run .NET integration tests
        run: dotnet test --project tests/NatsManager.Integration.Tests/NatsManager.Integration.Tests.csproj --configuration Release --no-restore --verbosity minimal
