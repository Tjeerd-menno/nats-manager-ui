name: PR Actions

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-actions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/NatsManager.Frontend/package-lock.json

      - name: Restore Aspire workload
        run: dotnet workload restore NatsManager.slnx

      - name: Restore .NET dependencies
        run: dotnet restore NatsManager.slnx

      - name: Install frontend dependencies
        working-directory: src/NatsManager.Frontend
        run: npm ci --ignore-scripts

      # Lint and format are listed as contribution gates in the README; they are enforced
      # here so the documented gate and the enforced gate are the same thing.
      - name: Lint frontend
        working-directory: src/NatsManager.Frontend
        run: npm run lint

      # Type-checks src and the test files (tsconfig.test.json), then bundles.
      - name: Build frontend
        working-directory: src/NatsManager.Frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: src/NatsManager.Frontend
        run: npm test

      - name: Verify .NET formatting
        run: dotnet format NatsManager.slnx --verify-no-changes

      - name: Build .NET solution
        run: dotnet build NatsManager.slnx --configuration Release --no-restore

      - name: Run .NET unit tests
        run: |
          dotnet test --project tests/NatsManager.Domain.Tests/NatsManager.Domain.Tests.csproj --configuration Release --no-restore --verbosity minimal
          dotnet test --project tests/NatsManager.Application.Tests/NatsManager.Application.Tests.csproj --configuration Release --no-restore --verbosity minimal
          dotnet test --project tests/NatsManager.Infrastructure.Tests/NatsManager.Infrastructure.Tests.csproj --configuration Release --no-restore --verbosity minimal
          dotnet test --project tests/NatsManager.Web.Tests/NatsManager.Web.Tests.csproj --configuration Release --no-restore --verbosity minimal

      # NatsManager.Integration.Tests starts the Aspire AppHost and a real NATS container.
      # It fails loudly rather than skipping when the container cannot start, so a green
      # run here means the adapters were genuinely exercised against a NATS server.
      - name: Run .NET integration tests
        run: dotnet test --project tests/NatsManager.Integration.Tests/NatsManager.Integration.Tests.csproj --configuration Release --no-restore --verbosity minimal

  e2e:
    name: End-to-end tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/NatsManager.Frontend/package-lock.json

      - name: Restore Aspire workload
        run: dotnet workload restore NatsManager.slnx

      - name: Restore .NET dependencies
        run: dotnet restore NatsManager.slnx

      # The E2E suite drives the Vite dev server through the Aspire AppHost, so the
      # frontend dependencies must be installed even though nothing is bundled here.
      - name: Install frontend dependencies
        working-directory: src/NatsManager.Frontend
        run: npm ci --ignore-scripts

      - name: Build .NET solution
        run: dotnet build NatsManager.slnx --configuration Release --no-restore

      # Playwright drives a real browser; the suite exercises the antiforgery
      # double-submit flow end to end (see E2EFixture).
      - name: Run E2E tests
        run: dotnet test --project tests/NatsManager.E2E.Tests/NatsManager.E2E.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts
          path: |
            tests/NatsManager.E2E.Tests/bin/**/playwright-report/**
            tests/NatsManager.E2E.Tests/bin/**/test-results/**
          if-no-files-found: ignore
          retention-days: 7
